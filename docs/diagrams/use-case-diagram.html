<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Figure 3.8 - Use Case Diagram</title>
  <style>
    body { font-family: "Times New Roman", Times, serif; background:#fff; color:#111; padding:30px; width:1150px; margin:0; }
    h1 { text-align:center; font-size:18px; margin-bottom:16px; }
    .caption { text-align:center; font-size:13px; color:#444; margin-top:12px; }
  </style>
</head>
<body>
  <h1>Figure 3.8: Use Case Diagram of the Proposed System</h1>
  <svg width="1080" height="700" xmlns="http://www.w3.org/2000/svg">
    <rect x="300" y="40" width="480" height="620" fill="none" stroke="#111" stroke-width="2"/>
    <text x="540" y="30" text-anchor="middle" font-size="14" font-weight="bold">Yobe E-Transport System</text>

    <!-- Passenger actor -->
    <circle cx="90" cy="120" r="18" fill="none" stroke="#111" stroke-width="2"/>
    <line x1="90" y1="138" x2="90" y2="190" stroke="#111" stroke-width="2"/>
    <line x1="60" y1="160" x2="120" y2="160" stroke="#111" stroke-width="2"/>
    <line x1="90" y1="190" x2="70" y2="240" stroke="#111" stroke-width="2"/>
    <line x1="90" y1="190" x2="110" y2="240" stroke="#111" stroke-width="2"/>
    <text x="90" y="265" text-anchor="middle" font-size="13">Passenger</text>

    <!-- Admin actor -->
    <circle cx="990" cy="360" r="18" fill="none" stroke="#111" stroke-width="2"/>
    <line x1="990" y1="378" x2="990" y2="430" stroke="#111" stroke-width="2"/>
    <line x1="960" y1="400" x2="1020" y2="400" stroke="#111" stroke-width="2"/>
    <line x1="990" y1="430" x2="970" y2="480" stroke="#111" stroke-width="2"/>
    <line x1="990" y1="430" x2="1010" y2="480" stroke="#111" stroke-width="2"/>
    <text x="990" y="505" text-anchor="middle" font-size="13">Administrator</text>

    <!-- Use cases -->
    <g font-size="12">
      <ellipse cx="420" cy="100" rx="95" ry="28" fill="#eef6ff" stroke="#111"/><text x="420" y="105" text-anchor="middle">Register / Login</text>
      <ellipse cx="620" cy="100" rx="95" ry="28" fill="#eef6ff" stroke="#111"/><text x="620" y="105" text-anchor="middle">Search Routes</text>
      <ellipse cx="420" cy="170" rx="105" ry="28" fill="#eef6ff" stroke="#111"/><text x="420" y="175" text-anchor="middle">View Schedules</text>
      <ellipse cx="620" cy="170" rx="105" ry="28" fill="#eef6ff" stroke="#111"/><text x="620" y="175" text-anchor="middle">Select Seats</text>
      <ellipse cx="520" cy="240" rx="105" ry="28" fill="#eef6ff" stroke="#111"/><text x="520" y="245" text-anchor="middle">Make Payment</text>
      <ellipse cx="420" cy="310" rx="105" ry="28" fill="#eef6ff" stroke="#111"/><text x="420" y="315" text-anchor="middle">Receive E-Ticket</text>
      <ellipse cx="620" cy="310" rx="105" ry="28" fill="#eef6ff" stroke="#111"/><text x="620" y="315" text-anchor="middle">View Booking History</text>
      <ellipse cx="520" cy="380" rx="105" ry="28" fill="#eef6ff" stroke="#111"/><text x="520" y="385" text-anchor="middle">Cancel Booking</text>

      <ellipse cx="420" cy="470" rx="110" ry="28" fill="#fff8e6" stroke="#111"/><text x="420" y="475" text-anchor="middle">Manage Fleet &amp; Routes</text>
      <ellipse cx="650" cy="470" rx="110" ry="28" fill="#fff8e6" stroke="#111"/><text x="650" y="475" text-anchor="middle">Manage Schedules</text>
      <ellipse cx="420" cy="540" rx="110" ry="28" fill="#fff8e6" stroke="#111"/><text x="420" y="545" text-anchor="middle">Monitor Bookings</text>
      <ellipse cx="650" cy="540" rx="110" ry="28" fill="#fff8e6" stroke="#111"/><text x="650" y="545" text-anchor="middle">Verify Tickets (QR)</text>
      <ellipse cx="535" cy="610" rx="110" ry="28" fill="#fff8e6" stroke="#111"/><text x="535" y="615" text-anchor="middle">Generate Reports</text>
    </g>

    <!-- Associations passenger -->
    <line x1="108" y1="120" x2="325" y2="100" stroke="#111"/>
    <line x1="108" y1="130" x2="325" y2="170" stroke="#111"/>
    <line x1="108" y1="140" x2="325" y2="240" stroke="#111"/>
    <line x1="108" y1="150" x2="325" y2="310" stroke="#111"/>
    <line x1="108" y1="160" x2="325" y2="380" stroke="#111"/>

    <!-- Associations admin -->
    <line x1="972" y1="360" x2="760" y2="470" stroke="#111"/>
    <line x1="972" y1="365" x2="760" y2="540" stroke="#111"/>
    <line x1="972" y1="370" x2="645" y2="610" stroke="#111"/>
  </svg>
  <p class="caption">Use case model showing passenger and administrator interactions with the proposed system</p>
</body>
</html>
