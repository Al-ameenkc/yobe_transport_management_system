<!DOCTYPE html>
<html lang="en">
<head>

  <title>Chart 4.1 - Module Test Pass Rate</title>

    .bar { width:60px; background:#047857; border:1px solid #065f46; }
    .label { margin-top:8px; font-size:11px; text-align:center; }
    .val { font-size:12px; font-weight:bold; margin-bottom:4px; }
    .caption { text-align:center; font-size:13px; color:#444; margin-top:16px; }
  </style>
</head>
<body>

</html>
